<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Wall clock — Felix De Montis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="clock">
  <div class="hours">
    <div class="first">
      <div class="number">0</div>
    </div>
    <div class="second">
      <div class="number">0</div>
    </div>
  </div>
  <div class="tick">:</div>
  <div class="minutes">
    <div class="first">
      <div class="number">0</div>
    </div>
    <div class="second">
      <div class="number">0</div>
    </div>
  </div>
  <div class="tick">:</div>
  <div class="seconds">
    <div class="first">
      <div class="number">0</div>
    </div>
    <div class="second infinite">
      <div class="number">0</div>
    </div>
  </div>
</div>
<script src="../_shared/chrono-time.js"></script>
<script src="script.js"></script>
</body>
</html>
