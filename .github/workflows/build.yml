name: Build & Release Tauri

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (optionnel)'
        required: false
        default: 'manuel'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Injecter la version du tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Version : $VERSION"
          VERSION="$VERSION" node -e "
            const fs = require('fs');
            const v = process.env.VERSION;
            for (const f of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2));
            }
            const cargo = 'src-tauri/Cargo.toml';
            const c = fs.readFileSync(cargo, 'utf8').replace(/^version = \".*\"/m, 'version = \"' + v + '\"');
            fs.writeFileSync(cargo, c);
            console.log('Versions mises à jour :', v);
          "

      - name: Installer dépendances npm
        run: npm install

      # Tag v* : build + création de la release GitHub
      - name: Build + publier la release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Chrono ${{ github.ref_name }}"
          releaseBody: "Voir CHANGELOG.md"
          releaseDraft: false
          prerelease: false

      # Lancement manuel depuis une branche : build seul, AUCUNE release/tag créé
      - name: Build seul (lancement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artefacts (lancement manuel)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: chrono-tauri-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7