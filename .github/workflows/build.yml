name: Build & Release Tauri

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (optionnel)'
        required: false
        default: 'manuel'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Injecter la version du tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Version : $VERSION"
          # Mettre à jour package.json
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version='$VERSION';
            fs.writeFileSync('package.json',JSON.stringify(p,null,2));
          "
          # Mettre à jour tauri.conf.json
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            p.version='$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(p,null,2));
          "
          # Mettre à jour Cargo.toml
          sed -i \"s/^version = .*/version = \\\"$VERSION\\\"/\" src-tauri/Cargo.toml

      - name: Extraire notes de version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          node -e "
            const fs=require('fs');
            const lines=fs.readFileSync('CHANGELOG.md','utf8').split('\n');
            let capture=false,notes=[];
            for(const l of lines){
              if(l.includes('## ')&&l.includes('v$VERSION')){capture=true;continue;}
              if(capture&&l.startsWith('## '))break;
              if(capture)notes.push(l);
            }
            fs.writeFileSync('release-notes.md',(notes.join('\n').trim()||'Voir CHANGELOG.md'));
          "

      - name: Installer dépendances npm
        run: npm install

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Chrono ${{ github.ref_name }}"
          releaseBody: "Voir CHANGELOG.md"
          releaseDraft: false
          prerelease: false

      - name: Artefacts (run manuel)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: chrono-tauri-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
          retention-days: 7
